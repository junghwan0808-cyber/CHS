<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prediger Mini Experience</title>
    <style>
      :root {
        --bg: #f4efe8;
        --panel: rgba(255, 255, 255, 0.7);
        --text: #212325;
        --muted: #5f6472;
        --border: rgba(33, 35, 37, 0.08);
        --shadow: 0 22px 48px rgba(63, 44, 22, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #fffaf5 0%, var(--bg) 42%, #ece3d8 100%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: var(--text);
      }

      .page {
        width: min(1024px, calc(100vw - 32px));
      }

      .shell {
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 28px;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.28);
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-size: 0.75rem;
      }

      .preview-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        padding: 8px 14px;
        background: rgba(255,255,255,0.5);
        border: 1px solid var(--border);
        font-size: 0.82rem;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffb36b, #d66b4d);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
      }

      .content {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
      }

      .panel {
        padding: 26px 28px 32px;
      }

      h1 {
        margin: 6px 0 12px;
        font-size: clamp(2rem, 4vw, 3.25rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
        max-width: 58ch;
      }

      .groups {
        display: grid;
        gap: 18px;
      }

      .group {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.35);
        border-radius: 18px;
        padding: 14px 14px 12px;
      }

      .group-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .group-name {
        font-weight: 700;
        font-size: 0.96rem;
      }

      .group-count {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .swatch {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        border: 2px solid transparent;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .swatch:hover,
      .swatch.active {
        transform: translateY(-2px) scale(1.02);
        border-color: rgba(17, 17, 17, 0.7);
        box-shadow: 0 8px 18px rgba(17,17,17,0.12);
      }

      .aside {
        background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(240,232,220,0.75));
        border-left: 1px solid var(--border);
        padding: 28px 22px;
      }

      .selected-card {
        padding: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,0.56);
        border: 1px solid var(--border);
      }

      .preview {
        height: 220px;
        border-radius: 20px;
        background: linear-gradient(135deg, #f0ae7a, #d7604a);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
        margin-bottom: 18px;
      }

      .meta-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .color-name {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .hex {
        font-size: 1rem;
        margin-top: 10px;
        color: var(--muted);
        letter-spacing: 0.08em;
      }

      .cta {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 12px;
        background: #1b1d1f;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }

        .aside {
          border-left: none;
          border-top: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <div class="topbar">
          <div class="brand">Prediger</div>
          <div class="preview-pill"><span class="dot"></span>Color Grouped</div>
        </div>

        <div class="content">
          <div class="panel">
            <h1>Find the mood that fits your brand.</h1>
            <p class="subtitle">
              Explore grouped color palettes for warm, cool, neutral, and vibrant directions.
              Each tone can become a starting point for a new interface, campaign, or product story.
            </p>

            <div class="groups" id="groups"></div>
          </div>

          <aside class="aside">
            <div class="selected-card">
              <div class="preview" id="preview"></div>
              <p class="meta-label">Selected shade</p>
              <h2 class="color-name" id="colorName">Sunset Coral</h2>
              <div class="hex" id="colorHex">#F0AE7A</div>
              <a class="cta" href="prediger_mini_experience_9select_color_grouped.html">Open detailed version</a>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <script>
      const paletteGroups = [
        {
          name: 'Warm Sunset',
          colors: [
            { name: 'Sunset Coral', hex: '#F0AE7A' },
            { name: 'Roasted Peach', hex: '#F7C59F' },
            { name: 'Terracotta', hex: '#D66B4D' },
            { name: 'Burnt Clay', hex: '#9E4D3C' }
          ]
        },
        {
          name: 'Fresh Garden',
          colors: [
            { name: 'Sage Mist', hex: '#C9D7C5' },
            { name: 'Botanical', hex: '#6E9B7A' },
            { name: 'Pine', hex: '#375D4A' },
            { name: 'Verdant', hex: '#1E4F3A' }
          ]
        },
        {
          name: 'Midnight Ink',
          colors: [
            { name: 'Ice Blue', hex: '#DDEBFF' },
            { name: 'Cloudy Blue', hex: '#A2B9D9' },
            { name: 'Slate', hex: '#475B7A' },
            { name: 'Midnight', hex: '#1D2C45' }
          ]
        },
        {
          name: 'Neutral Studio',
          colors: [
            { name: 'Stone', hex: '#E9E2D8' },
            { name: 'Sand', hex: '#D1BDA5' },
            { name: 'Walnut', hex: '#7C5A45' },
            { name: 'Espresso', hex: '#45312A' }
          ]
        }
      ];

      const groupsEl = document.getElementById('groups');
      const previewEl = document.getElementById('preview');
      const colorNameEl = document.getElementById('colorName');
      const colorHexEl = document.getElementById('colorHex');

      function renderGroups() {
        const firstColor = paletteGroups[0].colors[0];
        updateSelected(firstColor);

        groupsEl.innerHTML = paletteGroups.map(group => `
          <div class="group">
            <div class="group-header">
              <div class="group-name">${group.name}</div>
              <div class="group-count">${group.colors.length} shades</div>
            </div>
            <div class="swatches">
              ${group.colors.map((color, index) => `
                <button
                  class="swatch${index === 0 && group.name === paletteGroups[0].name ? ' active' : ''}"
                  type="button"
                  style="background:${color.hex}"
                  data-name="${color.name}"
                  data-hex="${color.hex}"
                  aria-label="Select ${color.name}"
                ></button>
              `).join('')}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.swatch').forEach(button => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.swatch').forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            updateSelected({ name: button.dataset.name, hex: button.dataset.hex });
          });
        });
      }

      function updateSelected(color) {
        previewEl.style.background = `linear-gradient(135deg, ${color.hex}, ${adjust(color.hex, -20)})`;
        colorNameEl.textContent = color.name;
        colorHexEl.textContent = color.hex;
      }

      function adjust(hex, amount) {
        const value = hex.replace('#', '');
        const num = parseInt(value, 16);
        const r = Math.max(0, Math.min(255, ((num >> 16) & 0xff) + amount));
        const g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amount));
        const b = Math.max(0, Math.min(255, (num & 0xff) + amount));
        return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
      }

      renderGroups();
    </script>
  </body>
</html>
